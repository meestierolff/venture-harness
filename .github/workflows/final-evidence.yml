name: founder-alpha-final-evidence

on:
  workflow_dispatch:

permissions:
  checks: read
  contents: read
  pull-requests: read
  security-events: read

concurrency:
  group: founder-alpha-final-evidence-${{ github.ref }}
  cancel-in-progress: false

jobs:
  final-evidence:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    environment:
      name: founder-alpha-final-evidence
    env:
      VH_EVIDENCE_SOURCE_SHA: ${{ github.sha }}
      VH_EVIDENCE_SOURCE_BRANCH: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: pnpm

      - name: Bind evidence to the clean checked-out source
        run: node scripts/initialize-final-evidence.mjs

      - name: Frozen install
        run: >-
          node scripts/run-audit-command.mjs --id final-frozen-install --
          pnpm install --frozen-lockfile

      - name: Prepare workspace packages
        run: pnpm workspace:prepare

      - name: Synchronize canonical agent surfaces
        run: >-
          node scripts/run-audit-command.mjs --id final-agent-sync --
          pnpm agents:sync

      - name: Install Chromium for socket-capable browser checks
        run: pnpm exec playwright install --with-deps chromium

      - name: Install pinned Gitleaks
        env:
          GITLEAKS_VERSION: 8.30.1
          GITLEAKS_LINUX_X64_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
        run: |
          curl --fail --location --silent --show-error \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" \
            --output /tmp/gitleaks.tar.gz
          echo "${GITLEAKS_LINUX_X64_SHA256}  /tmp/gitleaks.tar.gz" | sha256sum --check --strict
          tar -xzf /tmp/gitleaks.tar.gz -C /tmp gitleaks
          sudo install -m 0755 /tmp/gitleaks /usr/local/bin/gitleaks
          gitleaks version

      # Setup, not evidence: this prepares the child dependency closure so the
      # audited commands below can run at all. It carries no proof row.
      - name: Prepare child seed dependency closure
        run: pnpm seed:ensure agentic-web-saas

      - name: Fast verification profile
        run: >-
          node scripts/run-audit-command.mjs --id final-verify-fast --
          pnpm verify:fast

      # The local founder-alpha code gate is the ordered pair
      # `pnpm verify:mvp && pnpm verify:release`. Both audited steps must pass;
      # neither profile alone establishes code readiness.
      - name: MVP verification profile
        run: >-
          node scripts/run-audit-command.mjs --id final-verify-mvp --
          pnpm verify:mvp

      # This is the second half of the local founder-alpha gate. It proves the
      # release/package/security and deterministic Golden Path layers and must
      # reach PASS with no live provider connected.
      - name: Release verification profile
        env:
          VH_SEED_CLOSURE_REPORT: reports/audit/seed-closure.json
        run: >-
          node scripts/run-audit-command.mjs
          --id final-verify-release
          --artifact reports/audit/quality-release.json
          --artifact reports/audit/seed-closure.json
          -- pnpm verify:release -- --report reports/audit/quality-release.json

      # A missing provider is an honest INCOMPLETE, not a release failure and
      # not a fabricated PASS. An executed live read-back that fails, a missing
      # report, or any unexpected exit/status still fails this workflow.
      - name: Live provider verification attempt
        shell: bash
        run: |
          set +e
          node scripts/run-audit-command.mjs \
            --id final-verify-live \
            --artifact reports/audit/quality-live.json \
            -- pnpm verify:live -- --report reports/audit/quality-live.json
          command_exit="$?"
          set -e
          report_status="$(node -e '
            const { readFileSync } = require("node:fs");
            try {
              process.stdout.write(String(JSON.parse(readFileSync("reports/audit/quality-live.json", "utf8")).status));
            } catch {
              process.stdout.write("missing");
            }
          ')"
          echo "Live verification status: ${report_status}"
          case "${command_exit}:${report_status}" in
            0:PASS|1:INCOMPLETE) ;;
            *) echo "::error title=Live verification failed::exit=${command_exit}, status=${report_status}"; exit 1 ;;
          esac

      - name: Framework verification
        run: >-
          node scripts/run-audit-command.mjs --id final-verify --
          pnpm verify -- --delegate "pnpm test" --delegate "pnpm typecheck"

      - name: Public release inspection
        run: >-
          node scripts/run-audit-command.mjs --id final-release-check --
          pnpm release:check

      - name: Production dependency audit
        run: >-
          node scripts/run-audit-command.mjs --id final-prod-audit --
          pnpm audit --prod --audit-level=high

      - name: Raw HTML verification
        run: >-
          node scripts/run-audit-command.mjs --id final-raw-html --
          pnpm verify:raw-html:local

      - name: Browser journeys
        run: >-
          node scripts/run-audit-command.mjs --id final-e2e --
          pnpm test:e2e

      - name: Complete-history credential scan
        run: >-
          node scripts/run-audit-command.mjs --id final-gitleaks-history --
          gitleaks git . --config .gitleaks.toml --redact --no-banner --exit-code 1

      - name: Winner Loop Fixture D
        run: >-
          node scripts/run-audit-command.mjs \
          --id final-fixture-d \
          --artifact reports/audit/winner-loop-creative-trace.json \
          -- pnpm fixture:winner-loop

      - name: Test-control audit
        run: >-
          node scripts/run-audit-command.mjs --id final-test-controls --
          pnpm audit:test-controls

      - name: Generated workspace parity
        run: >-
          node scripts/run-audit-command.mjs --id final-workspace-check --
          pnpm workspace:check

      - name: Source-bound GitHub repository, PR, checks, and ruleset read-back
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_SECURITY_READ_TOKEN: ${{ secrets.VH_GITHUB_SECURITY_READ_TOKEN }}
        run: >-
          node scripts/run-audit-command.mjs
          --id final-github-readback
          --artifact reports/audit/github-readback.json
          -- node scripts/verify-final-github-readback.mjs
          --output reports/audit/github-readback.json

      # This audited scan covers every ledger producer. The exact portable
      # payload is assembled, scanned again, and only then uploaded below.
      - name: Current-tree and completed-evidence credential scan
        id: credential-scan
        run: >-
          node scripts/run-audit-command.mjs --id final-gitleaks-tree --
          gitleaks dir . --config .gitleaks.toml --redact --no-banner --exit-code 1

      - name: Render the evidence-backed completion matrix
        id: render-evidence
        run: pnpm exec tsx scripts/render-vh-v02-completion-matrix.ts

      - name: Render founder-alpha assignment evidence
        id: render-founder-alpha-evidence
        run: pnpm exec tsx scripts/render-founder-alpha-evidence.ts

      - name: Stage the exact portable evidence payload
        id: stage-evidence
        env:
          PORTABLE_EVIDENCE_ROOT: ${{ runner.temp }}/founder-alpha-final-evidence-${{ github.run_id }}
        run: node scripts/stage-final-evidence-upload.mjs --output "${PORTABLE_EVIDENCE_ROOT}"

      - name: Scan the exact portable evidence payload
        id: scan-portable-evidence
        env:
          PORTABLE_EVIDENCE_ROOT: ${{ runner.temp }}/founder-alpha-final-evidence-${{ github.run_id }}
        run: >-
          gitleaks dir "${PORTABLE_EVIDENCE_ROOT}"
          --config .gitleaks.toml --redact --no-banner --exit-code 1

      - name: Upload portable final evidence
        if: >-
          ${{ always() &&
          steps.credential-scan.outcome == 'success' &&
          steps.render-evidence.outcome == 'success' &&
          steps.render-founder-alpha-evidence.outcome == 'success' &&
          steps.stage-evidence.outcome == 'success' &&
          steps.scan-portable-evidence.outcome == 'success' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: founder-alpha-final-evidence-${{ github.run_id }}
          path: ${{ runner.temp }}/founder-alpha-final-evidence-${{ github.run_id }}/
          if-no-files-found: error
          retention-days: 90
