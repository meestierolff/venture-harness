name: venture child verification

on:
  workflow_call:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: pnpm
      - name: Install exact child dependencies
        run: pnpm install --frozen-lockfile --ignore-workspace
      - name: Install Chromium for the primary journey
        run: pnpm exec playwright install --with-deps chromium
      - name: Verify child production-shaped MVP
        env:
          NEXT_PUBLIC_SITE_URL: https://child-ci.example.invalid
          NEXT_PUBLIC_INDEXING_ENABLED: "true"
          VERCEL: "1"
          VERCEL_ENV: production
        run: pnpm verify:mvp
