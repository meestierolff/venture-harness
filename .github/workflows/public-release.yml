name: public-release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: public-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release-safety:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - name: Capability-aware release gate
        run: pnpm verify:release
      - name: Human checklist reminder
        run: |
          echo "Mechanical checks passed. The HUMAN half of the checklist"
          echo "(docs/public/PUBLIC_RELEASE_CHECKLIST.md) still applies:"
          echo "README review, legal review, no confidential material."
