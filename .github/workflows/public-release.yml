name: public-release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: public-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release-safety:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - name: Scan complete history for credentials
        uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7 # v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_VERSION: 8.30.1
          GITLEAKS_ENABLE_COMMENTS: false
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Prepare workspace packages
        run: pnpm workspace:prepare
      - name: Prepare child seed dependency closure
        run: pnpm seed:ensure agentic-web-saas
      - name: Inspect public repository and package contents
        run: pnpm release:check
      - name: Reject high-severity production dependency advisories
        run: pnpm audit --prod --audit-level=high
      - run: pnpm exec playwright install --with-deps chromium
      - name: Capability-aware MVP gate
        run: pnpm verify:mvp
      - name: Capability-aware release gate
        run: pnpm verify:release
      - name: Human checklist reminder
        run: |
          echo "Mechanical checks passed. The HUMAN half of the checklist"
          echo "(docs/public/PUBLIC_RELEASE_CHECKLIST.md) still applies:"
          echo "README review, legal review, no confidential material."
