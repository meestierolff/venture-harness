name: agent-parity

on:
  pull_request:
    paths:
      - "skills/**"
      - ".agents/**"
      - ".claude/skills/**"
      - "AGENTS.md"
      - "CLAUDE.md"
      - "GEMINI.md"
      - ".github/copilot-instructions.md"
      - "docs/agents/**"
      - "scripts/sync-agent-skills.ts"
      - "scripts/check-agent-parity.ts"
      - "scripts/lib/skill-sync.ts"
      - "config/framework.yaml"

permissions:
  contents: read

concurrency:
  group: agent-parity-${{ github.ref }}
  cancel-in-progress: true

jobs:
  parity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Skill validity and adapter parity
        run: pnpm agents:check
