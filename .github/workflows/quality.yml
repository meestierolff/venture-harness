name: quality

on:
  push:
    branches: [main]
  pull_request:

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Full deterministic gate
        run: pnpm verify
      - name: Lint and formatting
        run: |
          pnpm lint
          pnpm format:check
      - name: Production build
        run: pnpm build
      - name: Raw-HTML crawler checks
        run: |
          pnpm start &
          SERVER_PID=$!
          for i in $(seq 1 30); do
            curl -sf http://localhost:3000 >/dev/null && break
            sleep 1
          done
          pnpm verify:raw-html
          kill $SERVER_PID
