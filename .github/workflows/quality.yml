name: quality

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  fast:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Capability-aware fast profile
        env:
          QUALITY_BASE: ${{ github.event_name == 'pull_request' && format('origin/{0}', github.base_ref) || github.event.before }}
        run: pnpm verify:fast -- --base "$QUALITY_BASE"
      - name: Upload fast quality report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: quality-fast
          path: .venture/reports/quality/
          if-no-files-found: warn
          retention-days: 30

  mvp:
    needs: fast
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - name: Capability-aware MVP profile
        run: pnpm verify:mvp
      - name: Upload MVP quality report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: quality-mvp
          path: .venture/reports/quality/
          if-no-files-found: warn
          retention-days: 30

  release:
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref == 'refs/heads/main')
    needs: mvp
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - name: Capability-aware release profile
        run: pnpm verify:release
      - name: Upload release quality report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: quality-release
          path: .venture/reports/quality/
          if-no-files-found: warn
          retention-days: 90
