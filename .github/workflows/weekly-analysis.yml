name: weekly-analysis-smoke

# Explicit smoke workflow for the legacy weekly aggregate. The scheduled
# operating loop lives in learning-cadence.yml and never substitutes fixtures.
# Synthetic data runs here only when a human selects that labeled mode.

on:
  workflow_dispatch:
    inputs:
      data_mode:
        description: Evidence source for this explicit smoke run
        required: true
        type: choice
        default: synthetic_fixture
        options: [synthetic_fixture, configured_direct_sources]

permissions:
  contents: read

concurrency:
  group: weekly-analysis-${{ github.ref }}
  cancel-in-progress: true

jobs:
  weekly-report:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Prepare workspace packages
        run: pnpm workspace:prepare
      - name: Verify normalized scheduled-sync fixture
        run: pnpm exec vitest run tests/data-sync.test.ts tests/analytics-weekly.test.ts
      - name: Sync direct provider data
        if: inputs.data_mode == 'configured_direct_sources'
        run: pnpm vh data sync
      - name: Sync labeled fixture data when live sync is not enabled
        if: inputs.data_mode == 'synthetic_fixture'
        run: pnpm weekly -- --fixture --sync-only --sync-out .venture/data/latest.json
      - name: Aggregate only after a non-empty sync artifact exists
        run: pnpm weekly -- --datasets .venture/data/latest.json --require-data --out reports/weekly-ci
      - name: Upload normalized sync and report artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: weekly-demand-evidence
          path: |
            .venture/data/latest.json
            reports/weekly-ci/
          if-no-files-found: error
          retention-days: 90
